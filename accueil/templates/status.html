<!DOCTYPE html>
<html>
<head>
    <title>Backend Status</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background: #f9f9f9; }
        h1 { color: #2c3e50; }
        p { color: #555; }
        .traffic {
            display: flex; justify-content: center; gap: 10px; margin-top: 20px;
        }
        .dot {
            width: 15px; height: 15px;
            background: #27ae60; border-radius: 50%;
            animation: bounce 1s infinite alternate;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            from { transform: translateY(0); opacity: 0.7; }
            to { transform: translateY(-15px); opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>🚀 Backend is running</h1>
    <p>Traffic is flowing through the API...</p>
    <div class="traffic">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</body>
</html>
